version: '3'

services:
  frontend:
    container_name: frontend
    image: nextjs-docker-dev
    build: .
    ports:
      - 3000:3000
    restart: on-failure
    env_file:
      - .env.local

  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    restart: unless-stopped